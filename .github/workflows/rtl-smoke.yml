name: RTL focused smoke tests
on:
  pull_request:
  push:
    branches: [review/rtl-evidence-and-readme-20260916]
jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Elaborate canonical top level
        run: iverilog -g2012 -s digital_clock_top -o /tmp/clock_top.vvp hardware/verilog_sources/*.v
      - name: Verify display input sensitivity and decoding
        run: |
          iverilog -g2012 -s tb_seven_segment_display -o /tmp/display.vvp simulation/tb_seven_segment_display.v hardware/verilog_sources/seven_segment_display.v
          vvp /tmp/display.vvp
      - name: Verify counter modulo and enable
        run: |
          iverilog -g2012 -s tb_counter_x_bit -o /tmp/counter.vvp simulation/tb_counter_x_bit.v hardware/verilog_sources/counter_x_bit.v
          vvp /tmp/counter.vvp
